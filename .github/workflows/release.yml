name: Release

# GitHub Release only. This fork does not publish to npm; the upstream package
# name is not owned by this fork, and an accidental `npm publish` must not run
# from a version tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify the tag names this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$ACTUAL" || { echo "tag $VERSION != package.json $ACTUAL"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
